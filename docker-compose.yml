# soundable: Portainer stack (deploy from this git repository).
# All settings come from environment variables; see .env.example.
name: soundable

x-app: &app
  build:
    context: ./server
  image: soundable-server:latest
  restart: unless-stopped
  environment:
    POSTGRES_HOST: db
    POSTGRES_USER: ${POSTGRES_USER:-soundable}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB:-soundable}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (>= 32 chars)}
    SUBSONIC_USER: ${SUBSONIC_USER:-admin}
    SUBSONIC_PASSWORD: ${SUBSONIC_PASSWORD:?set SUBSONIC_PASSWORD}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-95}
    YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - music:/data/music
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soundable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-soundable}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *app
    command: ["api"]
    networks:
      internal: {}
      proxy:
        aliases: [soundable-api]

networks:
  internal: {}
  # The network your cloudflared container is attached to. cloudflared then reaches
  # the API at http://soundable-api:8000 (see README).
  proxy:
    external: true
    name: ${PROXY_NETWORK:-global}

volumes:
  pgdata: {}
  music: {}
